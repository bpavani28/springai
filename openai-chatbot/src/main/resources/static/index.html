<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAI Chatbot</title>

    ```
    <style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
    }

    .container {
        max-width: 800px;
        margin: 40px auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0,0,0,.12);
        overflow: hidden;
    }

    h1 {
        margin: 0;
        padding: 20px;
        background: #222;
        color: white;
        font-size: 22px;
    }

    .mode-area {
        padding: 15px 20px;
        border-bottom: 1px solid #ddd;
        background: #fafafa;
    }

    .mode-area label {
        font-weight: bold;
        margin-right: 10px;
    }

    select {
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
    }

    #messages {
        height: 500px;
        overflow-y: auto;
        padding: 20px;
    }

    .message {
        margin: 12px 0;
        padding: 12px 16px;
        border-radius: 10px;
        max-width: 75%;
        white-space: pre-wrap;
    }

    .user {
        background: #dbeafe;
        margin-left: auto;
    }

    .bot {
        background: #eeeeee;
    }

    .input-area {
        display: flex;
        padding: 15px;
        border-top: 1px solid #ddd;
        gap: 10px;
    }

    input {
        flex: 1;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
    }

    button {
        padding: 12px 20px;
        border: 0;
        border-radius: 8px;
        background: #222;
        color: white;
        cursor: pointer;
    }

    button:disabled {
        opacity: .5;
    }
</style>
    ```

</head>

<body>

<div class="container">

    ```
    <h1>OpenAI Chatbot</h1>

    <div class="mode-area">
        <label for="chatMode">Chat Mode:</label>

        <select id="chatMode">
            <option value="normal">Normal Chat</option>
            <option value="document">Document Chat</option>
        </select>
    </div>

    <div id="messages">
        <div class="message bot">
            Hello! How can I help you?
        </div>
    </div>

    <div class="input-area">
        <input
                id="messageInput"
                placeholder="Type your message..."
        />

        <button
                id="sendButton"
                onclick="sendMessage()">
            Send
        </button>
    </div>
    ```

</div>

<script>

async function sendMessage() {

    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");
    const mode = document.getElementById("chatMode").value;

    const text = input.value.trim();

    if (!text) {
        return;
    }

    addMessage(text, "user");

    input.value = "";
    button.disabled = true;

    try {

        // Decide which API to call
        let apiUrl;

        if (mode === "document") {
            apiUrl = "/api/document-chat";
        } else {
            apiUrl = "/api/chat";
        }

        const response = await fetch(apiUrl, {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: text
            })
        });

        if (!response.ok) {
            throw new Error(
                "Request failed: " + response.status
            );
        }

        const data = await response.json();

        addMessage(data.response, "bot");

    } catch (error) {

        addMessage(
            "Error: " + error.message,
            "bot"
        );

    } finally {

        button.disabled = false;
        input.focus();
    }
}


function addMessage(text, type) {

    const messages = document.getElementById("messages");

    const div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = text;
    messages.appendChild(div);

    messages.scrollTop =messages.scrollHeight;
}


document.getElementById("messageInput")
    .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });

</script>

</body>
</html>
